services:
  evet-sql:
    image: mcr.microsoft.com/mssql/server:2022-CU19-ubuntu-22.04
    container_name: evet-sql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "1401:1433"
    volumes:
      - evet-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - evet-network

  evet-rabbitmq:
    image: rabbitmq:3.13-management
    container_name: evet-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RabbitMq__Username}
      RABBITMQ_DEFAULT_PASS: ${RabbitMq__Password}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - evet-network

  # Lokalni SMTP server za razvoj i pregled rada; poslani mailovi se vide na http://localhost:8025
  evet-mailpit:
    image: axllent/mailpit:v1.31.5
    container_name: evet-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - evet-network

  evet-api:
    build:
      context: .
      dockerfile: eVet.API/Dockerfile
    container_name: evet-api
    restart: unless-stopped
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__eVetConnection: Server=evet-sql,1433;Database=${DB_NAME};User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True
      RabbitMq__Host: evet-rabbitmq
    ports:
      - "${API_PORT}:8080"
    depends_on:
      evet-sql:
        condition: service_healthy
      evet-rabbitmq:
        condition: service_healthy
    networks:
      - evet-network

  evet-worker:
    build:
      context: .
      dockerfile: eVet.Worker/Dockerfile
    container_name: evet-worker
    restart: unless-stopped
    env_file: .env
    environment:
      RabbitMq__Host: evet-rabbitmq
      Smtp__Host: evet-mailpit
    depends_on:
      evet-rabbitmq:
        condition: service_healthy
      evet-mailpit:
        condition: service_started
    networks:
      - evet-network

volumes:
  evet-sql-data:

networks:
  evet-network:
    driver: bridge
